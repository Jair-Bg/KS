name: Tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  gradient-area-chart:
    name: GradientAreaChart unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run GradientAreaChart tests
        run: npx vitest run src/components/charts/__tests__/GradientAreaChart.test.tsx --reporter=verbose
