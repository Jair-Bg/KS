name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

  gradient-area-chart:
    name: GradientAreaChart unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run GradientAreaChart tests
        run: npx vitest run src/components/charts/__tests__/GradientAreaChart.test.tsx --reporter=verbose

  supabase-security:
    name: Supabase security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase db start
        continue-on-error: false

      - name: Apply migrations
        run: supabase db reset --local

      - name: Run Supabase database linter (errors)
        run: |
          set -euo pipefail
          supabase db lint --level error --linked=false | tee lint-errors.txt
          if grep -qiE "level:\s*error|\berror\b" lint-errors.txt; then
            echo "::error::Supabase database linter reported errors"
            exit 1
          fi

      - name: Run Supabase security advisor checks
        run: |
          set -euo pipefail
          # Static policy checks: ensure no public-schema tables without RLS,
          # no SECURITY DEFINER views, and no unrestricted anon grants in new migrations.
          FAIL=0
          if grep -rniE "create\s+table\s+public\." supabase/migrations \
             | while read -r line; do
                 file="${line%%:*}"
                 if ! grep -qiE "enable\s+row\s+level\s+security" "$file"; then
                   echo "::error file=$file::New public table missing ENABLE ROW LEVEL SECURITY"
                   exit 1
                 fi
                 if ! grep -qiE "^\s*grant\s+" "$file"; then
                   echo "::error file=$file::New public table missing GRANT statements"
                   exit 1
                 fi
               done; then :; else FAIL=1; fi

          if grep -rniE "security\s+definer" supabase/migrations | grep -viE "function|procedure"; then
            echo "::error::SECURITY DEFINER used on a view — use security_invoker=true instead"
            FAIL=1
          fi

          exit $FAIL

